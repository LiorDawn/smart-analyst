[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-analyst"
version = "0.1.0"
description = "AI 经营分析官：自然语言问数 + 自动撰写经营分析报告"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # ── 智能体编排（LangGraph + LangChain + DeepAgents）──
    "langgraph>=1.1.6",
    "deepagents>=0.7",  # 深 agent 编排（subagents 原生子 agent 调度）
    "langgraph-checkpoint-redis>=0.5.2",
    "langchain>=1.2.15",
    "langchain-openai>=0.3",
    "langchain-deepseek>=1.0.1",
    "langchain-huggingface>=1.2.1",
    "huggingface-hub>=1.10.1",
    # ── 存储：MySQL + Redis + Qdrant + Elasticsearch ──
    "aiomysql>=0.2.0",
    "cryptography>=46.0.7",
    "greenlet>=3.4.0",
    "sqlalchemy>=2.0.49",
    "redis>=5.0",
    "qdrant-client>=1.17.1",
    "elasticsearch[async]>=8,<9",
    # ── 检索与分词 ──
    "jieba>=0.42.1",
    "fastembed>=0.6",  # BM25 稀疏向量（混合召回全文侧；进程内 CPU 计算）
    "langchain-mineru>=0.1.0",  # MinerU 云端文档解析（开发期；上线后支持切回离线解析）
    # ── 配置与日志 ──
    "omegaconf>=2.3.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "loguru>=0.7.3",
    # ── API 与 WebSocket ──
    "fastapi[standard]>=0.135.3",
    # ── 文件交付（报告生成）──
    "pypdf>=5.0",
    "python-docx>=1.1",
    "reportlab>=4.2",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pre-commit>=4.3.0",
    "ruff>=0.11.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]  # 只打包 app 包，排除顶层 conf/docker/frontend（避免 flat-layout 多包冲突）